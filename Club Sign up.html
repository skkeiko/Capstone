<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Sign Up</title>
</head>
<body>
    <h2>Silly Book Club Sign-Up Form</h2>

  <form action="webring.html" method="get">
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Book@gmail.com">
    <br><br>
    <label for="pass"> Password:</label>
    <br>
    <input type="password" id="pass" name="pass">
    <br><br>
    <label for="Book Compare">Book Compare:</label>
    <br>
    <select id="Book Compare" name="Book Compare">
      <option value="Harry Potter">Harry Potter</option>
      <option value="The Hobbit">The Hobbit</option>
    </select><br><br>
    <label for="reason">Why join?</label><br>
    <textarea id="reason" name="reason" rows="3" cols="30"></textarea>
    <br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
