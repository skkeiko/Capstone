<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Log in</title>

<body>
    <h1>Are you secretly a Unicorn?</h1>
    <h6>Find out here</h6>
    <form method="get">
        <p>Do you prefer</p>
        <!--added name attribute, aswell as made the name the same thing so that it can submit one or the other-->

        <br>
        <p>How do you feel about rainbows??</p><br>

        <input type="submit" value="submit">
    </form>
