<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies!</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>

    <form method="get">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" placeholder="First Name">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="name@email.com">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br>
        <p>Are you over the age of 18?</p>
        <label for="yes">Yes:</label>
        <input type="radio" id = "yes" name = "yes" value = "yes">
        <label for="no">No:</label>
        <input type="radio" id = "no" name = "yes" value = "no">
        <p>Do you have a Credit Card or PayPal?</p>
        <select id="payment"name="payment">
            <option value="credit">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select>
        <br><br>
        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
