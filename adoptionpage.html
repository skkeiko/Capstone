<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies!</title>
  </head>
  <body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
     <form method="get">
      <label for="FirstName">First Name:</label>          
      <input type="text" name="FirstName" id="FirstName" placeholder="First Name">
     <label for="LastName">Last Name:</label>
      <input type="text" name="LastName" id="LastName" placeholder="Last Name">
      <br>
      <label for="email">Email:</label>
      <input type="email" name="Email" id="email" placeholder="name@email.com">
      <label for="pass">Password:</label>
      <input type="password"  name="Password" id="pass" >
       <p>Are you over the age of 18?</p>
      <label for="yes">Yes:</label>
       <input type="radio" name="Over18" id="yes" value="yes">
      <label for="no">No:</label>
      <input type="radio" name="Over18" id="no" value="no">
       <p>Do you have a Credit Card or PayPal?</p>
       <select name="payment">
      <option value="cc">Credit Card</option>
      <option value="pp">PayPal</option>
       </select>
       <br><br>
       <input type="submit" name="submitted" value="Submit Feedback">
       </form>
  </body>
</html>
